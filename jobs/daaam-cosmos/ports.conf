# See jobs/percorso/ports.conf for the format and why this file exists.
#
# daaam-cosmos co-locates vLLM and the perception pipeline on one GPU, so it
# exposes the same three services as percorso + cosmos-reason2 combined, but
# as the weaker fit (that's the whole reason percorso/cosmos-reason2 were
# split out) — lower priority than either.
stream   9001   50
bridge   8100   50
cosmos   8000   50

# Not covered here: the AFK/sbatch launch mode submits separate jobs named
# "cosmos-server" and "daaam-worker" (bin/bjob's launch_afk, see
# jobs/daaam-cosmos/bjob_hooks.sh), which have no jobs/<name>/ directory of
# their own to hold a declaration. A consumer of this file still needs to
# know about those two names some other way.
