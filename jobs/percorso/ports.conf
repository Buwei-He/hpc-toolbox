# Services this profile exposes, for ssh-helper (robot/laptop side, in the
# percorso-perception repo) to discover instead of hardcoding a job-name map.
#
#   <svc>   <port>   [priority]     priority: lower = preferred when more
#                                    than one matching job is RUNNING at
#                                    once (default 50 if omitted)
#
# percorso is the dedicated demo profile — preferred over daaam-cosmos, which
# only co-locates the same services as a side effect of running everything
# on one GPU (see jobs/daaam-cosmos/ports.conf).
stream   9001   10
bridge   8100   10
